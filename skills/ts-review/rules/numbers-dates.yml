---
id: tsr-math-random
language: TypeScript
severity: warning
message: Math.random() — non-deterministic; check it is not inside render bodies, sort comparators, or identity generation.
note: >
  Lead. Random values in a component body or sort comparator cause re-render
  churn, unstable ordering, and SSR hydration mismatches.
rule:
  pattern: Math.random()
---
