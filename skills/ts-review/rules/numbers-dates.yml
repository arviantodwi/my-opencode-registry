---
id: tsr-date-from-string
language: TypeScript
severity: warning
message: Date constructed from a string — non-ISO parsing is implementation-defined and timezone-dependent.
note: >
  Lead. `new Date('2026-11-16')` parses as UTC midnight while
  `new Date('11/16/2026')` parses as local time — off-by-a-day bugs across time
  zones. Prefer explicit, timezone-aware construction.
rule:
  pattern: new Date($S)
---
id: tsr-date-from-string-tsx
language: Tsx
severity: warning
