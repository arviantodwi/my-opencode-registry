# Each rule ships as a TypeScript/Tsx twin pair: the TypeScript twin scans .ts
# files, the Tsx twin scans .tsx. Patterns are plain TS, valid in both languages.

id: tsr-parseint-no-radix
language: TypeScript
severity: warning
message: parseInt without a radix — parsing depends on the input string's prefix.
note: >
  Lead. Always pass a radix (usually 10); legacy engines treat leading zeros as
  octal, and inputs like "0x1F" change meaning silently.
rule:
  pattern: parseInt($S)
---
id: tsr-parseint-no-radix-tsx
language: Tsx
severity: warning
message: parseInt without a radix — parsing depends on the input string's prefix.
note: >
  Lead. Always pass a radix (usually 10); legacy engines treat leading zeros as
  octal, and inputs like "0x1F" change meaning silently.
rule:
