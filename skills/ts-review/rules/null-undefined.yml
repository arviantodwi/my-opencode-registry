---
id: tsr-cast-to-any
language: TypeScript
severity: warning
message: Cast to `any` — disables type checking, including null-safety, at this line.
note: >
  Lead. Prefer a precise type, `unknown` plus narrowing, or a documented reason.
  `as unknown as X` double casts deserve the same scrutiny.
rule:
  pattern: $X as any
---
