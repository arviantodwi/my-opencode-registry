id: tsr-map-async-unawaited
language: TypeScript
severity: warning
message: async callback in map returns promises — verify the caller awaits them.
note: >
  Lead: `$ARR.map(async ...)` produces an array of promises. If the result is
  not awaited or passed to Promise.all, the work floats and errors vanish.
rule:
  pattern: $ARR.map(async ($X) => $$BODY)
