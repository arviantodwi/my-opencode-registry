# Each rule ships as a TypeScript/Tsx twin pair: the TypeScript twin scans .ts
# files, the Tsx twin scans .tsx. Patterns are plain TS, valid in both languages.

id: tsr-foreach-async
language: TypeScript
severity: error
message: async callback in forEach — forEach ignores the returned promise.
note: >
  The loop does not wait, and rejections go unhandled. Use for...of with await,
  or build an array and pass it to Promise.all.
rule:
  pattern: $ARR.forEach(async ($X) => $$BODY)
---
