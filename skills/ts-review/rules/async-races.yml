id: tsr-async-promise-executor
language: TypeScript
severity: error
message: async executor inside new Promise — rejections and throws escape the promise.
note: >
  Anti-pattern: an async executor's errors become unhandled rejections outside
  the promise chain. Resolve/reject synchronously and await inside the chain
  instead.
rule:
  pattern: new Promise(async ($RES, $REJ) => {$$$B})
---
