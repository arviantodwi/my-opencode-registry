---
id: tsr-nested-ternary
language: TypeScript
severity: hint
message: Nested ternary — complexity lead for the readability pass.
note: >
  Lead, not a bug. Nested conditionals hide which branch runs; suggest
  extracting.
rule:
  pattern: "$A ? $B ? $C : $D : $E"
---
id: tsr-nested-ternary-tsx
language: Tsx
severity: hint
message: Nested ternary — complexity lead for the readability pass.
note: >
